org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Windows: projeto em D:\ e Pub cache em C:\ causa falha no compilador Kotlin incremental
# ("this and base files have different roots"). Desativar incremental evita o problema.
kotlin.incremental=false
