name: edugestao
description: EDUCLASS – Gestão Escolar. Moderno, profissional e offline-first.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  google_sign_in: ^7.2.0
  google_sign_in_all_platforms: ^2.0.2

  # Persistência Local (Offline-first)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.22
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3

  # Gestão de Estado e Navegação
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3

  # Networking
  dio: ^5.4.3+1

  # UI e Design System
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  flutter_svg: ^2.0.10+1
  
  # PDF e Impressão
  pdf: ^3.11.1
  printing: ^5.13.2
  
  # Upload de Ficheiros
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/identidade visual.png
